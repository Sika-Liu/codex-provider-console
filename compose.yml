services:
  codex-provider-console:
    build: .
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8787}:8787"
    volumes:
      - "${CODEX_HOME_HOST:-./codex-data}:/codex"
      # Mount the home directory at its original absolute path. The official
      # installer writes absolute symlinks, which must remain valid over SSH.
      - "${CODEX_USER_HOME_HOST:-./codex-user-home}:${CODEX_USER_HOME_CONTAINER_PATH:-/user-home}"
    environment:
      CODEX_HOME: /codex
      PANEL_AUTH_ENABLED: "${PANEL_AUTH_ENABLED:-true}"
      PANEL_USERNAME: "${PANEL_USERNAME:-}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      PANEL_SESSION_SECRET: "${PANEL_SESSION_SECRET:-}"
      PANEL_COOKIE_SECURE: "${PANEL_COOKIE_SECURE:-false}"
      CODEX_CLI_VERSION: "${CODEX_CLI_VERSION:-not_installed}"
      CODEX_CLI_USER: "${CODEX_CLI_USER:-unknown}"
      DEPLOY_USER: "${DEPLOY_USER:-unknown}"
      HOME: "${CODEX_USER_HOME_CONTAINER_PATH:-/user-home}"
      USER_HOME_PATH: "${CODEX_USER_HOME_CONTAINER_PATH:-/user-home}"
      HOST_CODEX_BIN: "${CODEX_USER_HOME_CONTAINER_PATH:-/user-home}/.local/bin/codex"
      HOST_USER_HOME_PATH: "${CODEX_USER_HOME_HOST:-}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
